name: CI — AI Agent Service

on:
  push:
    branches: [master, main]
    paths: ['services/ai-agent-service/**']
  pull_request:
    branches: [master, main]
    paths: ['services/ai-agent-service/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-agent-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/ai-agent-service/package-lock.json

      - name: Install dependencies
        run: npm ci

  docker:
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-agent-service

    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & Push Docker image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/ai-agent-service:${{ github.sha }} .
          docker tag ${{ secrets.ACR_LOGIN_SERVER }}/ai-agent-service:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/ai-agent-service:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/ai-agent-service:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/ai-agent-service:latest

  deploy:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_AI_AGENT }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/ai-agent-service:${{ github.sha }}
